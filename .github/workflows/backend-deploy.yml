name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

concurrency:
  group: vaidyacure-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy Backend
        run: |
          cd /var/www/vaidyacure
          git pull origin main
          cd backend
          npm ci
          npm run build
          pm2 restart vaidyacure-backend --update-env