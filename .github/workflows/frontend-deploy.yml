name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'admin-panel/**'
      - '.github/workflows/frontend-deploy.yml'

concurrency:
  group: vaidyacure-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy Frontend
        run: |
          cd /var/www/vaidyacure
          git pull origin main
          cd admin-panel
          npm ci
          npm run build
          pm2 restart vaidyacure-frontend --update-env