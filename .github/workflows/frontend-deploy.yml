name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'admin-panel/**'
      - '.github/workflows/frontend-deploy.yml'

concurrency:
  group: vaidyacure-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/vaidyacure
            git pull origin main
            cd admin-panel
            npm ci
            npm run build
            pm2 restart vaidyacure-frontend --update-env